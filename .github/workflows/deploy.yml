name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Suntikkan secrets ke index.html
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          ACCESS_PIN: ${{ secrets.ACCESS_PIN }}
        run: |
          sed -i "s|__WEBAPP_URL__|${WEBAPP_URL}|g" index.html
          sed -i "s|__APP_KEY__|${APP_KEY}|g" index.html
          sed -i "s|__ACCESS_PIN__|${ACCESS_PIN}|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
